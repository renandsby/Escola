[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    -v
    --tb=short
testpaths = tests apps/students/tests apps/class_diary/tests apps/governance/tests apps/curriculum/tests apps/classes/tests apps/authentication/tests apps/schools/tests apps/reports/tests apps/dashboard/tests apps/backups/tests apps/audit/tests apps/documents/tests apps/notifications/tests
markers =
    django_db: marks tests as needing database (deselect with '-m "not django_db"')
    slow: marks tests as slow (deselect with '-m "not slow"')
