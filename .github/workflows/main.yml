name: Main CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-ci.yml

  frontend-tests:
    uses: ./.github/workflows/frontend-ci.yml

  integration:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker --version && docker-compose --version

      - name: Create .env file
        run: cp .env.example .env

      - name: Build and start services
        run: docker-compose build

      - name: Wait for services
        run: sleep 10

      - name: Check health endpoints
        run: |
          curl -f http://localhost:8000/health/ || exit 1
          curl -f http://localhost:8000/health/ready/ || exit 1
        continue-on-error: true

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration]
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.backend-tests.result }}" = "failure" ] || [ "${{ needs.frontend-tests.result }}" = "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Create status badge
        run: |
          echo "Build Status: ${{ steps.status.outputs.status }}"
