# Reverse proxy de produção — P1-HARDEN
# Termina TLS, comprime, limita upload e encaminha para backend/frontend na
# rede interna do Docker. Coloque os certificados em ./nginx/certs/
# (fullchain.pem + privkey.pem — Let's Encrypt ou a CA do município).

upstream escola_backend {
    server backend:8000;
}
upstream escola_frontend {
    server frontend:80;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # API + admin + schema
    location ~ ^/(api|admin|health)/ {
        proxy_pass http://escola_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }
    location /media/ {
        # arquivos gerados (relatórios, documentos) — servidos só com autenticação
        # pela app; aqui apenas como fallback interno.
        internal;
        alias /srv/media/;
    }

    # SPA
    location / {
        proxy_pass http://escola_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
